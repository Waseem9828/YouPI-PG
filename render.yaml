
services:
  - type: web
    name: youpi-pg-demo
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci
    startCommand: node scripts/start-render-demo.js
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: 24.22.1

      - key: NODE_ENV
        value: production

      - key: YOUPI_MODE
        value: production

      - key: YOUPI_BIND_HOST
        value: 0.0.0.0

      - key: YOUPI_ALLOW_LOCALHOST_MODE
        value: "true"

      - key: USE_SQLITE_FALLBACK
        value: "true"

      - key: ENCRYPTION_MASTER_KEY
        generateValue: true

      - key: JWT_SECRET
        generateValue: true

      - key: YOUPI_ALLOW_DEV_TOOLS
        value: "false"

      - key: YOUPI_EXPOSE_DEV_OTP
        value: "false"

      - key: YOUPI_ENFORCE_OBSERVER_HEALTH
        value: "false"

      - key: ADMIN_API_TOKEN
        generateValue: true

      - key: DEFAULT_APP_NAME
        value: "YouPI Gateway"

      - key: YOUPI_ALLOWED_ORIGINS
        value: "https://youpi-pg-3l9g.onrender.com"
